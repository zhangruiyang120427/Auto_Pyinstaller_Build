# Release 工作流：跑完构建后自动打包成 zip 并发布 Release
# 触发方式：
#   1. workflow_run：build.yml 成功完成后自动触发（推荐）
#   2. workflow_dispatch：手动按钮，方便补发历史版本
name: Release-自动发版

on:
  workflow_run:
    workflows: ["Python打包-自带样例-缓存依赖-归档历史"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (留空自动用 yyyyMMdd-HHmmss)'
        required: false
        default: ''

permissions:
  contents: write   # 创建 tag + Release 必须

jobs:
  release:
    # workflow_run 触发时，只有上游成功才发版
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python (用于打包 zip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 确定 tag 名
        id: tag
        shell: python
        run: |
          import datetime, os
          manual = os.environ.get("MANUAL_TAG", "").strip()
          ts = datetime.datetime.now().strftime("%Y%m%d-%H%M%S")
          print(f"tag={manual or f'v{ts}'}")
          with open(os.environ["GITHUB_OUTPUT"], "w") as f:
              f.write(f"tag={manual or f'v{ts}'}\n")
        env:
          MANUAL_TAG: ${{ github.event.inputs.tag_name }}

      - name: 打包 build/ 下的 exe 为 zip
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $zipName = "Auto_Pyinstaller_${tag}.zip"
          $buildDir = "build"

          if (-not (Test-Path -Path $buildDir)) {
            Write-Error "build/ 目录不存在，没有产物可发版"
            exit 1
          }

          $exes = @(Get-ChildItem -Path $buildDir -Filter "*.exe" -File)
          if ($exes.Count -eq 0) {
            Write-Error "build/ 目录下没有 .exe 产物"
            exit 1
          }

          Compress-Archive -Path "$buildDir/*" -DestinationPath $zipName -Force
          Write-Host "==> 已打包: $zipName"
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: 创建 / 更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
