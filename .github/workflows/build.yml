# 工作流：Python 一键打包 | 自带样例文件 | 自动缓存依赖 | 永不删源码
name: Python打包-自带样例-缓存依赖-安全打包

# 触发方式：手动按钮，可视化配置参数
on:
  workflow_dispatch:
    inputs:
      console_mode:
        description: '程序运行时是否显示黑色控制台窗口'
        required: true
        default: '无控制台窗口(-w) 推荐GUI程序'
        type: choice
        options:
          - 无控制台窗口(-w) 推荐GUI程序
          - 显示控制台窗口(-c) 推荐带print的程序
      build_mode:
        description: '打包文件格式'
        required: true
        default: '单个独立exe(-F) 推荐'
        type: choice
        options:
          - 单个独立exe(-F) 推荐
          - 文件夹形式(无-F) 适合大项目
      exe_name:
        description: 'EXE文件名(留空则与入口py同名)'
        required: false
        default: ''
      python_ver:
        description: '打包用Python版本(必须与本地一致)'
        required: true
        default: '3.10'
        type: choice
        options:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
      py_deps:
        description: '额外依赖(空格分隔；常规依赖建议写 files/requirements.txt)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 1) 拉取仓库（含 files/ 下的源文件）
      - name: 拉取仓库文件
        uses: actions/checkout@v4

      # 2) 配置Python + 自动缓存pip（关键改进：减少每次重装依赖的时间）
      - name: 配置Python (带pip缓存)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_ver }}
          cache: 'pip'
          cache-dependency-path: files/requirements.txt

      # 3) 升级pip并装PyInstaller
      - name: 安装 PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # 4) 装依赖：优先 files/requirements.txt，再加上UI输入的额外依赖
      - name: 安装项目依赖
        shell: pwsh
        run: |
          if (Test-Path -Path "files/requirements.txt") {
            $content = (Get-Content "files/requirements.txt" -Raw).Trim()
            if ($content -match '[^#\s]') {
              Write-Host "==> 从 files/requirements.txt 安装依赖"
              pip install -r files/requirements.txt
            } else {
              Write-Host "==> files/requirements.txt 为空或全注释，跳过"
            }
          } else {
            Write-Host "==> files/requirements.txt 不存在，跳过"
          }
          $extra = "${{ github.event.inputs.py_deps }}".Trim()
          if ($extra -ne "") {
            Write-Host "==> 安装额外依赖: $extra"
            pip install $extra
          }

      # 5) 准备 build 输出目录
      - name: 准备 build/ 目录
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }

      # 6) 核心打包：自动找入口 + 拼接 PyInstaller 参数（带图标）
      - name: 自动定位入口并打包
        shell: pwsh
        run: |
          # 自动定位 files/ 下的入口 .py：优先 main.py，否则取第一个
          $pyFiles = @(Get-ChildItem -Path "files" -Filter "*.py" -File)
          if ($pyFiles.Count -eq 0) {
            Write-Error "files/ 目录下没有任何 .py 源文件，请先把代码放进去"
            exit 1
          }
          $sourcePy = $pyFiles | Where-Object { $_.Name -ieq "main.py" } | Select-Object -First 1
          if (-not $sourcePy) { $sourcePy = $pyFiles[0] }
          Write-Host "==> 入口源文件: files/$($sourcePy.Name)"

          # 自动确定 EXE 名称
          $exeName = "${{ github.event.inputs.exe_name }}".Trim()
          if ($exeName -eq "") {
            $exeName = [System.IO.Path]::GetFileNameWithoutExtension($sourcePy.Name)
          }

          # 拼接 PyInstaller 参数
          $pyArgs = @("files/$($sourcePy.Name)")
          if ("${{ github.event.inputs.build_mode }}" -eq "单个独立exe(-F) 推荐") {
            $pyArgs += "-F"
          }
          if ("${{ github.event.inputs.console_mode }}" -eq "无控制台窗口(-w) 推荐GUI程序") {
            $pyArgs += "-w"
          } else {
            $pyArgs += "-c"
          }
          $pyArgs += @("-n", $exeName)

          # 图标：files/icon.ico 存在就加上，不存在也不报错
          $iconPath = "files/icon.ico"
          if (Test-Path -Path $iconPath) {
            Write-Host "==> 使用图标: $iconPath"
            $pyArgs += @("--icon", $iconPath)
          } else {
            Write-Host "==> 未发现 $iconPath，跳过图标设置"
          }

          Write-Host "==> 执行: pyinstaller $($pyArgs -join ' ')"
          pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 7) 把 dist/ 下的产物搬到 build/ 供下载
      - name: 迁移产物到 build/
        shell: pwsh
        run: |
          $distExe = Get-ChildItem -Path "dist" -Filter "*.exe" -File -Recurse | Select-Object -First 1
          if (-not $distExe) {
            Write-Error "dist/ 下未找到 .exe，打包可能失败"
            exit 1
          }
          Move-Item -Path $distExe.FullName -Destination "build/" -Force
          Write-Host "==> 已迁移: build/$($distExe.Name)"

      # 8) 上传产物（注意：本次工作流不再删除 files/ 下的源码，避免下次无法复打）
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ github.event.inputs.exe_name || 'main' }}
          path: build/*.exe
          if-no-files-found: error
