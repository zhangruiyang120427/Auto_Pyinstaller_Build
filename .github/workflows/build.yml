# 工作流：Python 一键打包 | 自带样例文件 | 自动缓存依赖 | 打包后归档
name: Python打包-自带样例-缓存依赖-归档历史

# 触发方式：手动按钮，可视化配置参数
on:
  workflow_dispatch:
    inputs:
      console_mode:
        description: '程序运行时是否显示黑色控制台窗口'
        required: true
        default: '无控制台窗口(-w) 推荐GUI程序'
        type: choice
        options:
          - 无控制台窗口(-w) 推荐GUI程序
          - 显示控制台窗口(-c) 推荐带print的程序
      build_mode:
        description: '打包文件格式'
        required: true
        default: '单个独立exe(-F) 推荐'
        type: choice
        options:
          - 单个独立exe(-F) 推荐
          - 文件夹形式(无-F) 适合大项目
      exe_name:
        description: 'EXE文件名(留空则与入口py同名)'
        required: false
        default: ''
      python_ver:
        description: '打包用Python版本(必须与本地一致)'
        required: true
        default: '3.10'
        type: choice
        options:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
      py_deps:
        description: '额外依赖(空格分隔；常规依赖建议写 files/requirements.txt)'
        required: false
        default: ''
      publish_release:
        description: '打包完是否自动发 GitHub Release'
        required: true
        default: '发 Release(打 zip 作为 asset)'
        type: choice
        options:
          - 发 Release(打 zip 作为 asset)
          - 不发 Release

# 发 Release 需要写权限
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # 1) 拉取仓库（含 files/ 下的源文件）
      - name: 拉取仓库文件
        uses: actions/checkout@v4

      # 2) 配置Python + 自动缓存pip（关键改进：减少每次重装依赖的时间）
      - name: 配置Python (带pip缓存)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ github.event.inputs.python_ver }}
          cache: 'pip'
          cache-dependency-path: files/requirements.txt

      # 3) 升级pip并装PyInstaller
      - name: 安装 PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # 4) 装依赖：优先 files/requirements.txt，再加上UI输入的额外依赖
      - name: 安装项目依赖
        shell: pwsh
        run: |
          if (Test-Path -Path "files/requirements.txt") {
            $content = (Get-Content "files/requirements.txt" -Raw).Trim()
            if ($content -match '[^#\s]') {
              Write-Host "==> 从 files/requirements.txt 安装依赖"
              pip install -r files/requirements.txt
            } else {
              Write-Host "==> files/requirements.txt 为空或全注释，跳过"
            }
          } else {
            Write-Host "==> files/requirements.txt 不存在，跳过"
          }
          $extra = "${{ github.event.inputs.py_deps }}".Trim()
          if ($extra -ne "") {
            Write-Host "==> 安装额外依赖: $extra"
            pip install $extra
          }

      # 5) 准备 build 输出目录
      - name: 准备 build/ 目录
        shell: pwsh
        run: |
          if (-not (Test-Path -Path "build")) { New-Item -ItemType Directory -Path "build" | Out-Null }

      # 6) 核心打包：自动找入口 + 拼接 PyInstaller 参数（带图标）
      - name: 自动定位入口并打包
        shell: pwsh
        run: |
          # 自动定位 files/ 下的入口 .py：优先 main.py，否则取第一个
          $pyFiles = @(Get-ChildItem -Path "files" -Filter "*.py" -File)
          if ($pyFiles.Count -eq 0) {
            Write-Error "files/ 目录下没有任何 .py 源文件，请先把代码放进去"
            exit 1
          }
          $sourcePy = $pyFiles | Where-Object { $_.Name -ieq "main.py" } | Select-Object -First 1
          if (-not $sourcePy) { $sourcePy = $pyFiles[0] }
          Write-Host "==> 入口源文件: files/$($sourcePy.Name)"

          # 自动确定 EXE 名称
          $exeName = "${{ github.event.inputs.exe_name }}".Trim()
          if ($exeName -eq "") {
            $exeName = [System.IO.Path]::GetFileNameWithoutExtension($sourcePy.Name)
          }

          # 拼接 PyInstaller 参数
          $pyArgs = @("files/$($sourcePy.Name)")
          if ("${{ github.event.inputs.build_mode }}" -eq "单个独立exe(-F) 推荐") {
            $pyArgs += "-F"
          }
          if ("${{ github.event.inputs.console_mode }}" -eq "无控制台窗口(-w) 推荐GUI程序") {
            $pyArgs += "-w"
          } else {
            $pyArgs += "-c"
          }
          $pyArgs += @("-n", $exeName)

          # 图标：files/icon.ico 存在就加上，不存在也不报错
          $iconPath = "files/icon.ico"
          if (Test-Path -Path $iconPath) {
            Write-Host "==> 使用图标: $iconPath"
            $pyArgs += @("--icon", $iconPath)
          } else {
            Write-Host "==> 未发现 $iconPath，跳过图标设置"
          }

          Write-Host "==> 执行: pyinstaller $($pyArgs -join ' ')"
          pyinstaller @pyArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 7) 把 dist/ 下的产物搬到 build/ 供下载
      - name: 迁移产物到 build/
        shell: pwsh
        run: |
          $distExe = Get-ChildItem -Path "dist" -Filter "*.exe" -File -Recurse | Select-Object -First 1
          if (-not $distExe) {
            Write-Error "dist/ 下未找到 .exe，打包可能失败"
            exit 1
          }
          Move-Item -Path $distExe.FullName -Destination "build/" -Force
          Write-Host "==> 已迁移: build/$($distExe.Name)"

      # 8) 上传产物
      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ github.event.inputs.exe_name || 'main' }}
          path: build/*.exe
          if-no-files-found: error

      # 9) 把本次用的源码归档到 Last_Files/，再清空 files/*.py
      #    - 每次新源码进 files/，触发一次打包
      #    - 旧源码不会被"覆盖式丢失"，而是带时间戳归档到 Last_Files/
      - name: 归档源码到 Last_Files 并清空 files/
        if: always() && success()
        shell: pwsh
        run: |
          $ts = Get-Date -Format "yyyyMMdd-HHmmss"
          $exeName = "${{ github.event.inputs.exe_name }}".Trim()
          if ($exeName -eq "") { $exeName = "main" }
          $tag = "${exeName}_$ts"

          # 1) 确保 Last_Files/ 存在
          if (-not (Test-Path -Path "Last_Files")) {
            New-Item -ItemType Directory -Path "Last_Files" | Out-Null
          }
          $archiveDir = "Last_Files/$tag"
          New-Item -ItemType Directory -Path $archiveDir | Out-Null

          # 2) 把 files/ 下所有内容（不含 build 产物）原样拷贝到归档目录
          $pyCount = 0
          Get-ChildItem -Path "files" -File | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination $archiveDir -Force
            if ($_.Extension -eq ".py") { $pyCount++ }
          }
          Write-Host "==> 归档: $archiveDir (含 $pyCount 个 .py 源文件)"

          # 3) 删除 files/ 下的 .py 源文件（保留 readme/requirements 等）
          Get-ChildItem -Path "files" -Filter "*.py" -File -ErrorAction SilentlyContinue | ForEach-Object {
            Remove-Item -Path $_.FullName -Force
            Write-Host "==> 删除: files/$($_.Name)"
          }

          # 4) 在 Last_Files/$tag 写个说明
          @"
打包时间: $ts
EXE 名称: $exeName
工作流运行: ${{ github.run_id }}
工作流链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
"@ | Out-File -FilePath "$archiveDir/_BUILD_INFO.txt" -Encoding utf8

          # 5) 提交这次归档
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          $changes = git status --porcelain
          if ($changes) {
            git commit -m "archive: $tag (build #${{ github.run_number }})"
            git push
            Write-Host "==> 已提交归档"
          } else {
            Write-Host "==> 无文件变动，跳过提交"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10) 把 build/ 下的 exe 打成 zip，发 GitHub Release
      #     - 在同一 job 内直发，不再用第二个工作流
      #     - 跳过条件：用户选了"不发 Release"
      - name: 打 zip 并发 GitHub Release
        if: github.event.inputs.publish_release == '发 Release(打 zip 作为 asset)'
        shell: pwsh
        run: |
          $ts = Get-Date -Format "yyyyMMdd-HHmmss"
          $exeName = "${{ github.event.inputs.exe_name }}".Trim()
          if ($exeName -eq "") { $exeName = "main" }
          $tag = "v$ts"
          $zipName = "${exeName}_$tag.zip"

          $exes = @(Get-ChildItem -Path "build" -Filter "*.exe" -File)
          if ($exes.Count -eq 0) {
            Write-Error "build/ 目录下没有 .exe，跳过发版"
            exit 1
          }
          Compress-Archive -Path "build/*" -DestinationPath $zipName -Force
          Write-Host "==> 已打包: $zipName"

          # 写一份 release body
          $body = @"
## $exeName $tag

- 打包时间: $ts
- 入口: files/main.py (运行编号 #${{ github.run_number }})
- 工作流: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

### 使用说明
1. 下载下方的 zip
2. 解压得到 `${exeName}.exe`
3. 双击运行（需 Windows）
"@
          $bodyFile = "RELEASE_BODY.md"
          $body | Out-File -FilePath $bodyFile -Encoding utf8

          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          echo "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV
          echo "RELEASE_BODY=$bodyFile" >> $env:GITHUB_ENV

      - name: 创建 / 更新 GitHub Release
        if: github.event.inputs.publish_release == '发 Release(打 zip 作为 asset)'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_BODY }}
          files: ${{ env.RELEASE_ZIP }}
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
